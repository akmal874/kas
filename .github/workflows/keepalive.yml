name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 1 * * 1,4"   # Senin & Kamis, 01:00 UTC (09:00 WITA)
  workflow_dispatch:         # bisa dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/pengaturan?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY"
          echo ""
          echo "Supabase aktif: $(date -u)"
